sonar.projectKey=email-tone-fixer
sonar.projectName=AI Email Tone Fixer
sonar.projectVersion=1.0

# Self-hosted SonarQube server (see docker-compose.yml)
sonar.host.url=http://localhost:9000

sonar.sources=core,services,api,main.py,config.py
sonar.tests=eval
sonar.exclusions=**/__pycache__/**,**/*.pyc,.venv/**,node_modules/**,*.json,*.lock,*.yaml,*.yml

sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
